Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
EndSection
Section "Device"
    Identifier "ReviewDummy"
    Driver "dummy"
    VideoRam 256000
EndSection
Section "Monitor"
    Identifier "ReviewMonitor"
    HorizSync 28.0-200.0
    VertRefresh 48.0-75.0
    Modeline "1600x900" 108.00 1600 1624 1704 1800 900 901 904 1000 +HSync +VSync
EndSection
Section "Screen"
    Identifier "ReviewScreen"
    Device "ReviewDummy"
    Monitor "ReviewMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1600x900"
        Virtual 1600 900
    EndSubSection
EndSection
Section "ServerLayout"
    Identifier "ReviewLayout"
    Screen "ReviewScreen"
EndSection
